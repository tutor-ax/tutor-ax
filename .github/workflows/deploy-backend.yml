name: deploy-backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

# 같은 스택을 두 배포가 동시에 건드리지 않게
concurrency: deploy-backend

permissions:
  id-token: write # AWS OIDC — 장기 액세스 키를 저장하지 않는다
  contents: read

jobs:
  deploy:
    # ARM 러너: Graviton(ARM64) 이미지를 에뮬레이션 없이 빌드
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: backend tests
        run: cd backend && ./mvnw -q test
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: infra/package-lock.json }
      - name: infra tests
        run: cd infra && npm ci && npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: cdk deploy
        run: cd infra && npx cdk deploy --require-approval never ${{ vars.CDK_CONTEXT }}
