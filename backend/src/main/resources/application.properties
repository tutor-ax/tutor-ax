spring.application.name=backend
server.port=8080
# 읽기 전용 DB 계정(tutor_ax_readonly). 값은 ../.env.local에서 환경변수로 넣는다. 코드·레포에 비밀값을 두지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Supabase 커넥션 한도를 Edge Function과 나눠 쓴다(운영 전환 문서 제약 2) — 파드당 2개
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=5000
# 풀러(트랜잭션 모드)에서는 prepared statement 캐시를 끈다
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jdbc.template.query-timeout=10s
# 둘 중 하나라도 비면 관리자 API는 전부 503으로 닫힌다(fail closed). 세션 비밀값은 32자 이상.
tutorax.admin-password=${ADMIN_PASSWORD:}
tutorax.session-secret=${ADMIN_SESSION_SECRET:}
# 비면 질문 생성만 503, 카드는 그대로 동작
tutorax.gemini-api-key=${GEMINI_API_KEY:}
